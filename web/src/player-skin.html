<!-- Adapted from Video.js 10.5.0 (Apache-2.0). The settings menu was replaced with a playback rate control. -->

<media-container class="media-skin media-container video-skin" data-theme="default" data-preset="video" style="--media-scale: 1">
  <slot></slot>
  <media-poster class="media-poster">
    <slot name="poster">
      <img alt="" decoding="async" class="media-poster-image">
    </slot>
  </media-poster>
  <media-buffering-indicator class="media-buffering-indicator">
    <media-icon name="spinner" class="media-buffering-indicator-spinner-icon"></media-icon>
  </media-buffering-indicator>
  <media-error-dialog class="media-dialog-root">
    <media-dialog-backdrop class="media-dialog-backdrop"></media-dialog-backdrop>
    <media-dialog-popup class="media-dialog-popup">
      <div class="media-dialog-content">
        <media-dialog-title class="media-dialog-title"></media-dialog-title>
        <media-dialog-description class="media-dialog-description"></media-dialog-description>
      </div>
      <div class="media-dialog-actions">
        <media-dialog-close class="media-button media-dialog-close"></media-dialog-close>
      </div>
    </media-dialog-popup>
  </media-error-dialog>
  <media-title class="media-title"></media-title>
  <media-controls>
    <media-buffering-indicator class="video-controls-center-buffering">
      <media-controls-group class="video-controls-center">
        <media-seek-button class="media-button media-seek-button video-controls-center-button video-controls-center-seek" seconds="-10">
          <div class="media-seek-button-content">
            <media-icon name="seek" class="media-button-icon media-seek-button-backward-icon"></media-icon>
            <span class="media-seek-button-label media-seek-button-backward-label">10</span>
          </div>
        </media-seek-button>
        <media-play-button class="media-button media-play-button video-controls-center-button video-controls-center-play">
          <media-icon name="restart" class="media-button-icon media-play-button-restart-icon video-controls-center-play-icon"></media-icon>
          <media-icon name="play" class="media-button-icon media-play-button-play-icon video-controls-center-play-icon"></media-icon>
          <media-icon name="pause" class="media-button-icon media-play-button-pause-icon video-controls-center-play-icon"></media-icon>
        </media-play-button>
        <media-seek-button class="media-button media-seek-button video-controls-center-button video-controls-center-seek" seconds="10">
          <div class="media-seek-button-content">
            <media-icon name="seek" class="media-button-icon"></media-icon>
            <span class="media-seek-button-label media-seek-button-forward-label">10</span>
          </div>
        </media-seek-button>
      </media-controls-group>
    </media-buffering-indicator>
    <media-controls-backdrop class="video-controls-backdrop"></media-controls-backdrop>
    <media-controls-content class="video-controls video-controls-content">
      <media-tooltip-group>
        <media-controls-group class="video-controls-primary video-controls-compact-primary">
          <media-play-button class="media-button media-play-button" id="play-button">
            <media-icon name="restart" class="media-button-icon media-play-button-restart-icon"></media-icon>
            <media-icon name="play" class="media-button-icon media-play-button-play-icon"></media-icon>
            <media-icon name="pause" class="media-button-icon media-play-button-pause-icon"></media-icon>
          </media-play-button>
          <media-tooltip trigger="play-button" side="top" class="media-popup media-popup-safe-area media-popup-transition media-popup-surface media-tooltip">
            <media-tooltip-label></media-tooltip-label>
            <media-tooltip-shortcut class="media-tooltip-shortcut"></media-tooltip-shortcut>
          </media-tooltip>
          <media-mute-button commandfor="volume-popover" class="media-button media-mute-button video-controls-volume-button" id="mute-button">
            <media-icon name="volume-off" class="media-button-icon media-mute-button-off-icon"></media-icon>
            <media-icon name="volume-low" class="media-button-icon media-mute-button-low-icon"></media-icon>
            <media-icon name="volume-high" class="media-button-icon media-mute-button-high-icon"></media-icon>
          </media-mute-button>
          <media-tooltip trigger="mute-button" delay="0" disabled sticky side="top" class="media-popup media-popup-safe-area media-popup-transition media-popup-surface media-tooltip">
            <media-tooltip-label></media-tooltip-label>
            <media-tooltip-shortcut class="media-tooltip-shortcut"></media-tooltip-shortcut>
          </media-tooltip>
          <media-volume-popover open-on-hover delay="200" close-delay="100" side="top" class="media-popup media-popup-safe-area media-popup-transition media-popup-surface media-volume-popover" id="volume-popover">
            <media-volume-slider class="media-slider media-volume-slider" thumb-alignment="edge" orientation="vertical">
              <media-slider-track class="media-slider-track">
                <media-slider-fill class="media-slider-fill"></media-slider-fill>
              </media-slider-track>
              <media-slider-thumb class="media-slider-thumb media-volume-slider-thumb"></media-slider-thumb>
            </media-volume-slider>
          </media-volume-popover>
          <media-controls-group class="video-time-slider-group">
            <media-time class="media-time-value video-controls-current-time-value" type="current"></media-time>
            <media-time-slider class="media-slider media-time-slider video-controls-time-slider">
              <media-time-slider-chapters class="media-time-slider-chapters">
                <template>
                  <div class="media-time-slider-chapter">
                    <media-slider-track class="media-slider-track media-time-slider-chapter-track">
                      <media-slider-buffer class="media-slider-buffer media-time-slider-chapter-layer"></media-slider-buffer>
                      <media-slider-fill class="media-slider-fill media-time-slider-chapter-layer"></media-slider-fill>
                    </media-slider-track>
                  </div>
                </template>
              </media-time-slider-chapters>
              <media-slider-thumb class="media-slider-thumb media-time-slider-thumb"></media-slider-thumb>
              <media-slider-preview class="media-slider-preview" overflow="visible">
                <media-slider-thumbnail class="media-slider-preview-content media-popup-surface media-slider-thumbnail">
                  <slot name="thumbnail">
                    <img alt="" aria-hidden="true" decoding="async" class="media-slider-thumbnail-image"></slot>
                    <media-icon name="spinner" class="media-slider-thumbnail-spinner-icon"></media-icon>
                  </media-slider-thumbnail>
                  <div class="media-slider-preview-content media-time-slider-preview-content">
                    <media-time-slider-chapter-title class="media-time-slider-chapter-title"></media-time-slider-chapter-title>
                    <media-slider-value class="media-time-slider-value" type="pointer"></media-slider-value>
                  </div>
                </media-slider-preview>
              </media-time-slider>
              <media-time class="media-time-toggle video-controls-remaining-time-value" type="remaining" toggle></media-time>
            </media-controls-group>
            <media-captions-button class="media-button media-captions-button video-controls-captions-button" id="captions-button">
              <media-icon name="captions-off" class="media-button-icon media-captions-button-off-icon"></media-icon>
              <media-icon name="captions-on" class="media-button-icon media-captions-button-on-icon"></media-icon>
            </media-captions-button>
            <media-tooltip trigger="captions-button" side="top" class="media-popup media-popup-safe-area media-popup-transition media-popup-surface media-tooltip">
              <media-tooltip-label></media-tooltip-label>
              <media-tooltip-shortcut class="media-tooltip-shortcut"></media-tooltip-shortcut>
            </media-tooltip>
            <media-playback-rate-button commandfor="playback-rate-menu" label="倍速" class="media-button" id="playback-rate-trigger">
              <media-icon name="speed" class="media-button-icon"></media-icon>
            </media-playback-rate-button>
            <media-tooltip trigger="playback-rate-trigger" side="top" class="media-popup media-popup-safe-area media-popup-transition media-popup-surface media-tooltip">
              <media-tooltip-label></media-tooltip-label>
            </media-tooltip>
            <media-menu side="top" align="center" class="media-popup media-popup-surface media-menu-popup media-menu-resizable-popup" id="playback-rate-menu">
              <media-menu-content class="media-menu-content">
                <media-playback-rate-radio-group rates="0.5 0.75 1 1.25 1.5 1.75 2" class="media-menu-radio-group">
                  <template>
                    <media-menu-radio-item class="media-menu-radio-item">
                      <span data-part="label"></span>
                      <media-menu-item-indicator force-mount class="media-menu-item-indicator">
                        <media-icon name="check" class="media-menu-radio-item-icon"></media-icon>
                      </media-menu-item-indicator>
                    </media-menu-radio-item>
                  </template>
                </media-playback-rate-radio-group>
              </media-menu-content>
            </media-menu>
          </media-controls-group>
          <media-controls-group class="video-controls-secondary video-controls-top-controls">
            <media-pip-button class="media-button media-pip-button" id="pip-button">
              <media-icon name="pip-enter" class="media-button-icon media-pip-button-enter-icon"></media-icon>
              <media-icon name="pip-exit" class="media-button-icon media-pip-button-exit-icon"></media-icon>
            </media-pip-button>
            <media-tooltip trigger="pip-button" side="top" class="media-popup media-popup-safe-area media-popup-transition media-popup-surface media-tooltip">
              <media-tooltip-label></media-tooltip-label>
              <media-tooltip-shortcut class="media-tooltip-shortcut"></media-tooltip-shortcut>
            </media-tooltip>
            <media-fullscreen-button class="media-button media-fullscreen-button" id="fullscreen-button">
              <media-icon name="fullscreen-enter" class="media-button-icon media-fullscreen-button-enter-icon"></media-icon>
              <media-icon name="fullscreen-exit" class="media-button-icon media-fullscreen-button-exit-icon"></media-icon>
            </media-fullscreen-button>
            <media-tooltip trigger="fullscreen-button" side="top" class="media-popup media-popup-safe-area media-popup-transition media-popup-surface media-tooltip">
              <media-tooltip-label></media-tooltip-label>
              <media-tooltip-shortcut class="media-tooltip-shortcut"></media-tooltip-shortcut>
            </media-tooltip>
          </media-controls-group>
        </media-tooltip-group>
      </media-controls-content>
    </media-controls>
    <media-hotkey keys="Space" action="togglePaused"></media-hotkey>
    <media-hotkey keys="k" action="togglePaused"></media-hotkey>
    <media-hotkey keys="m" action="toggleMuted"></media-hotkey>
    <media-hotkey keys="ArrowRight" action="seekStep"></media-hotkey>
    <media-hotkey keys="ArrowLeft" action="seekStep"></media-hotkey>
    <media-hotkey keys="l" action="seekStep"></media-hotkey>
    <media-hotkey keys="j" action="seekStep"></media-hotkey>
    <media-hotkey keys="ArrowUp" action="volumeStep"></media-hotkey>
    <media-hotkey keys="ArrowDown" action="volumeStep"></media-hotkey>
    <media-hotkey keys="0-9" action="seekToPercent"></media-hotkey>
    <media-hotkey keys="Home" action="seekToPercent" value="0"></media-hotkey>
    <media-hotkey keys="End" action="seekToPercent" value="100"></media-hotkey>
    <media-hotkey keys="&gt;" action="speedUp"></media-hotkey>
    <media-hotkey keys="&lt;" action="speedDown"></media-hotkey>
    <media-hotkey keys="f" action="toggleFullscreen"></media-hotkey>
    <media-hotkey keys="c" action="toggleSubtitles"></media-hotkey>
    <media-hotkey keys="i" action="togglePictureInPicture"></media-hotkey>
    <media-gesture type="tap" action="togglePaused" pointer="mouse" region="center"></media-gesture>
    <media-gesture type="tap" action="toggleControls" pointer="touch"></media-gesture>
    <media-gesture type="doubletap" action="seekStep" region="left"></media-gesture>
    <media-gesture type="doubletap" action="toggleFullscreen" region="center"></media-gesture>
    <media-gesture type="doubletap" action="seekStep" region="right"></media-gesture>
    <media-status-announcer class="media-status-announcer"></media-status-announcer>
    <div class="video-status-indicators">
      <media-volume-indicator class="media-indicator media-volume-indicator">
        <media-volume-indicator-fill class="media-indicator-content media-volume-indicator-fill">
          <media-icon name="volume-high" class="media-volume-indicator-high-icon"></media-icon>
          <media-icon name="volume-low" class="media-volume-indicator-low-icon"></media-icon>
          <media-icon name="volume-off" class="media-volume-indicator-off-icon"></media-icon>
          <media-volume-indicator-value class="media-volume-indicator-value"></media-volume-indicator-value>
        </media-volume-indicator-fill>
      </media-volume-indicator>
      <media-status-indicator actions="toggleSubtitles,toggleFullscreen,togglePictureInPicture" class="media-indicator media-status-indicator">
        <div class="media-indicator-content media-status-indicator-content">
          <media-icon name="captions-on" class="media-status-indicator-captions-on-icon"></media-icon>
          <media-icon name="captions-off" class="media-status-indicator-captions-off-icon"></media-icon>
          <media-icon name="fullscreen-enter" class="media-status-indicator-fullscreen-enter-icon"></media-icon>
          <media-icon name="fullscreen-exit" class="media-status-indicator-fullscreen-exit-icon"></media-icon>
          <media-icon name="pip-enter" class="media-status-indicator-pip-enter-icon"></media-icon>
          <media-icon name="pip-exit" class="media-status-indicator-pip-exit-icon"></media-icon>
          <media-status-indicator-value class="media-status-indicator-value"></media-status-indicator-value>
        </div>
      </media-status-indicator>
      <media-seek-indicator class="media-seek-indicator">
        <media-icon name="chevron" class="media-seek-indicator-icon"></media-icon>
        <media-seek-indicator-value class="media-seek-indicator-value"></media-seek-indicator-value>
      </media-seek-indicator>
      <media-status-indicator actions="togglePaused" class="media-playback-status-indicator">
        <media-icon name="play" class="media-playback-status-indicator-play-icon"></media-icon>
        <media-icon name="pause" class="media-playback-status-indicator-pause-icon"></media-icon>
      </media-status-indicator>
    </div>
  </media-container>
