name: Build and Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (MAJOR.MINOR.PATCH)'
        required: true
        default: '4.0.0'
      android_version_code:
        description: 'Increasing Android versionCode'
        required: true
        default: '14'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  RELEASE_VERSION: ${{ inputs.version || '4.0.0' }}
  ANDROID_VERSION_CODE: ${{ inputs.android_version_code || '13' }}
  ANDROID_SIGNING_CERT_SHA256: 0d81ab7cb1a16d58d91a953fe62049eb77fc840cc544a297ae1854f54bc73b96

jobs:
  build-macos:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify Apple toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcodebuild -version | grep -Fx 'Xcode 27.2'
          test "$(xcrun --sdk macosx --show-sdk-version)" = 27.2
          xcrun swift --version
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Validate release inputs
        run: python3 scripts/validate-release.py
      - name: Test core, Native bridge and CLI
        run: |
          ./gradlew :core:jvmTest :core:macosArm64Test :nativeBridge:macosArm64Test :nativeBridge:linkDebugFrameworkMacosArm64 :cli:linkReleaseExecutableMacosArm64 -PreleaseVersion="$RELEASE_VERSION"
          python3 scripts/check-cli-contract.py cli/build/bin/macosArm64/releaseExecutable/tigertv.kexe
          mkdir -p build
          swiftc -parse-as-library -F nativeBridge/build/bin/macosArm64/debugFramework -framework TigerTVCore scripts/check-native-bridge.swift -o build/check-native-bridge
          build/check-native-bridge
          swift test --package-path macOS
      - name: Build native macOS app
        run: |
          xcodebuild -quiet -project macOS/TigerTV.xcodeproj -scheme TigerTV -configuration Release -derivedDataPath DerivedData ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$RELEASE_VERSION" build
      - name: Package unsigned macOS app and CLI
        run: |
          mkdir -p artifacts build/cli-package
          ditto -c -k --keepParent 'DerivedData/Build/Products/Release/小老虎爱看剧.app' artifacts/TigerTV-macOS-arm64.zip
          cp cli/build/bin/macosArm64/releaseExecutable/tigertv.kexe build/cli-package/tigertv
          tar -czf artifacts/TigerTV-CLI-macOS-arm64.tar.gz -C build/cli-package tigertv
          cd artifacts
          for asset in *.zip *.tar.gz; do shasum -a 256 "$asset" > "$asset.sha256"; done
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: tigertv-macos
          path: artifacts/*
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate release inputs
        run: python3 scripts/validate-release.py
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmdline-tools;latest"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Restore shared Android signing key
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CI_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CI_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          umask 077
          mkdir -p ~/.android
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          keytool -exportcert -keystore ~/.android/debug.keystore -storepass "$CI_RELEASE_STORE_PASSWORD" -alias "$CI_RELEASE_KEY_ALIAS" | sha256sum | grep -F "$ANDROID_SIGNING_CERT_SHA256"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then cp ~/.android/debug.keystore AndroidTV/release.keystore; fi
      - name: Test core and Android TV
        run: |
          ./AndroidTV/gradlew :core:jvmTest testDebugUnitTest lintDebug
      - name: Build shared-key debug APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: ./AndroidTV/gradlew assembleDebug
      - name: Build signed release
        if: github.event_name == 'workflow_dispatch'
        env:
          CI_RELEASE_STORE_FILE: ${{ github.workspace }}/AndroidTV/release.keystore
          CI_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CI_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CI_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./AndroidTV/gradlew assembleRelease -PreleaseVersion="$RELEASE_VERSION" -PandroidVersionCode="$ANDROID_VERSION_CODE"
      - name: Package universal APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          mkdir -p artifacts
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then VARIANT=release; NAME=universal; else VARIANT=debug; NAME=debug; fi
          APK_DIR="AndroidTV/build/outputs/apk/$VARIANT"
          APK_FILE=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["elements"][0]["outputFile"])' "$APK_DIR/output-metadata.json")
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK_DIR/$APK_FILE" | grep -F "certificate SHA-256 digest: $ANDROID_SIGNING_CERT_SHA256"
          unzip -Z1 "$APK_DIR/$APK_FILE" | grep '^lib/' > build-apk-libraries.txt
          grep -q '^lib/armeabi-v7a/' build-apk-libraries.txt
          grep -q '^lib/arm64-v8a/' build-apk-libraries.txt
          cp "$APK_DIR/$APK_FILE" "artifacts/TigerTV-AndroidTV-$NAME.apk"
          cd artifacts
          for asset in *.apk; do sha256sum "$asset" > "$asset.sha256"; done
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: tigertv-android
          path: artifacts/*
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        run: rm -f AndroidTV/release.keystore ~/.android/debug.keystore

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [build-macos, build-android]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: tigertv-*
          merge-multiple: true
          path: artifacts
      - name: Verify release assets
        run: |
          cd artifacts
          test -f TigerTV-macOS-arm64.zip
          test -f TigerTV-CLI-macOS-arm64.tar.gz
          test -f TigerTV-AndroidTV-universal.apk
          sha256sum -c *.sha256
      - uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: artifacts/*
