name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 3.0.0)'
        required: true
        default: '2.0.0'

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build macOS (arm64)
        run: |
          xcodebuild \
            -project "macOS/TigerTV.xcodeproj" \
            -scheme "TigerTV" \
            -configuration Release \
            -derivedDataPath DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package macOS
        run: |
          APP_PATH="DerivedData/Build/Products/Release/小老虎爱看剧.app"
          VERSION="${{ github.event.inputs.version }}"
          ZIP_NAME="TigerTV-macOS-arm64-${VERSION}.zip"

          ditto -c -k --keepParent "${APP_PATH}" "${ZIP_NAME}"

          echo "version=${VERSION}" >> "$GITHUB_ENV"
          echo "macos_asset_path=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "Version: ${VERSION}"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: tigertv-macos
          path: ${{ env.macos_asset_path }}

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check shared contract and CLI
        run: .github/scripts/check-contract.sh

      - name: Generate release keystore
        working-directory: ./AndroidTV
        run: |
          keytool -genkey \
            -v \
            -keystore release.keystore \
            -alias tigertv \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass tigertv \
            -keypass tigertv \
            -dname "CN=TigerTV"

      - name: Build Android TV (universal)
        working-directory: ./AndroidTV
        env:
          CI_RELEASE_STORE_FILE: ${{ github.workspace }}/AndroidTV/release.keystore
          CI_RELEASE_STORE_PASSWORD: tigertv
          CI_RELEASE_KEY_ALIAS: tigertv
          CI_RELEASE_KEY_PASSWORD: tigertv
        run: |
          ./gradlew test assembleRelease

      - name: Package Android TV
        run: |
          APK_PATH=$(find AndroidTV/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          VERSION="${{ github.event.inputs.version }}"
          APK_NAME="TigerTV-AndroidTV-universal-${VERSION}.apk"

          cp "${APK_PATH}" "${APK_NAME}"
          echo "android_asset_path=${APK_NAME}" >> "$GITHUB_ENV"
          echo "APK: ${APK_NAME}"

      - name: Upload Android TV artifact
        uses: actions/upload-artifact@v7
        with:
          name: tigertv-android
          path: ${{ env.android_asset_path }}

  release:
    runs-on: ubuntu-latest
    needs: [build-macos, build-android]
    permissions:
      contents: write

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: tigertv-macos
          path: ./artifacts

      - name: Download Android TV artifact
        uses: actions/download-artifact@v8
        with:
          name: tigertv-android
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          generate_release_notes: true
          files: ./artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
