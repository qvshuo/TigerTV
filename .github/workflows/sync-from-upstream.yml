name: Sync LunaTV-config.json

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-lunatv-config
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download and validate source configuration
        shell: bash
        run: |
          download=$(mktemp)
          trap 'rm -f "$download"' EXIT
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 --retry 3 \
            https://raw.githubusercontent.com/hafrey1/LunaTV-config/main/LunaTV-config.json -o "$download"
          jq -e 'type == "object" and (.api_site | type == "object" and length > 0)' "$download" > /dev/null
          mkdir -p skills/references
          cp "$download" skills/references/LunaTV-config.json
      - name: Commit configuration when changed
        shell: bash
        run: |
          git add skills/references/LunaTV-config.json
          if git diff --staged --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync LunaTV-config.json from upstream'
          git push
